# Netlify configuration for AURA ARENA (Next.js 14 App Router)
# The @netlify/plugin-nextjs plugin handles API routes as Netlify Functions,
# static pages as CDN assets, and ISR/SSR pages correctly.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Force Next.js to emit a standalone output understood by the Netlify plugin.
  # Do NOT add secrets here -- use the Netlify dashboard Environment Variables UI.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
