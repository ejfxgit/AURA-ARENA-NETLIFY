  <rect x="49" y="146" width="158" height="32" rx="8" fill="#38bdf8" fill-opacity=".46"/>
  <rect x="68" y="106" width="120" height="32" rx="8" fill="#38bdf8" fill-opacity=".68"/>
  <rect x="87" y="66" width="82" height="32" rx="8" fill="#7dd3fc"/>

  <!-- structure break above the stack -->
