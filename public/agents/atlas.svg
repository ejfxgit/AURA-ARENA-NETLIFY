<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ATLAS">
  <defs>
    <radialGradient id="atlasBg" cx="50%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#06283a"/>
      <stop offset="58%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="atlasGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
