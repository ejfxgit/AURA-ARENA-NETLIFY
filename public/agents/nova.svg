    <path d="M128 128 64 91"/>
  </g>
  <g fill="#d8b4fe">
    <circle cx="128" cy="54" r="15"/>
    <circle cx="192" cy="91" r="13"/>
    <circle cx="192" cy="165" r="13"/>
    <circle cx="128" cy="202" r="15"/>
    <circle cx="64" cy="165" r="13"/>
    <circle cx="64" cy="91" r="13"/>
  </g>

  <!-- nova core -->
  <circle cx="128" cy="128" r="31" fill="#0b0715"/>
  <circle cx="128" cy="128" r="31" fill="none" stroke="#e9d5ff" stroke-width="9"/>
  <circle cx="128" cy="128" r="12" fill="#ffffff"/>
