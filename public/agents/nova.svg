      <stop offset="0%" stop-color="#221541"/>
      <stop offset="58%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="novaGlow" cx="50%" cy="50%" r="50%">
